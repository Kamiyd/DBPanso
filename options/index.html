<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>豆瓣盘搜 · 设置</title>
    <link rel="stylesheet" href="../styles/theme.css?v=20260804-laser-fade-loop-2" />
    <link rel="stylesheet" href="options.css?v=20260809-dbpanso-1" />
  </head>
  <body>
    <div class="page">
      <header>
        <div class="heading-row">
          <h1>频道管理</h1>
          <button
            type="button"
            class="sound-toggle"
            id="btn-sound"
            title="关闭音效"
            aria-label="关闭音效"
            aria-pressed="true"
            data-cuelume-toggle="toggle"
          ></button>
        </div>
        <p class="sub">
          添加公开 TG 频道，搜索时会从这些来源整理网盘资源。抓取地址为
          <code>t.me/s/频道?q=关键词</code>。
        </p>
      </header>

      <section class="panel">
        <div class="channel-add">
          <h2>添加频道</h2>
          <form id="add-form" class="add-form" autocomplete="off">
            <label class="channel-search-field" for="channel-input">
              <span id="channel-search-icon" class="channel-search-icon" aria-hidden="true">
                <svg class="dbp-icon dbp-icon--round" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" focusable="false">
                  <circle cx="10.5" cy="10.5" r="6.75"></circle>
                  <path d="m16 16 4.5 4.5"></path>
                </svg>
              </span>
              <input
                id="channel-input"
                type="text"
                placeholder="@slug 或 https://t.me/slug"
                spellcheck="false"
              />
            </label>
          </form>
          <p id="add-msg" class="msg"></p>
        </div>
        <div class="panel-head">
          <h2>已配置频道</h2>
          <div class="actions">
            <label class="concurrency">
              并发
              <input id="concurrency" type="number" min="2" max="20" value="8" />
            </label>
            <button
              type="button"
              class="btn source-refresh selection-unrelated"
              id="btn-source-refresh"
              title="立即更新频道来源"
              aria-label="立即更新频道来源"
            >
              <span class="btn-icon" id="source-refresh-icon" aria-hidden="true"></span>
              <span class="btn-label">更新</span>
            </button>
            <button
              type="button"
              class="btn selection-unrelated"
              id="btn-check"
              title="检测频道连接"
              aria-label="检测频道连接"
            >
              <span class="btn-icon" aria-hidden="true"></span>
              <span class="btn-label">检测连接</span>
            </button>
            <button
              type="button"
              class="btn danger selection-unrelated"
              id="btn-disable-dead"
              title="停用失效频道"
              aria-label="停用失效频道"
              hidden
            >
              <span class="btn-icon" aria-hidden="true"></span>
              <span class="btn-label">停用失效</span>
            </button>
            <button
              type="button"
              class="btn check-cancel"
              id="btn-cancel-check"
              title="返回检测前状态"
              aria-label="取消并返回"
              hidden
            >
              <span class="btn-label">取消</span>
            </button>
            <button
              type="button"
              class="btn"
              id="btn-select-all"
              title="全选频道"
              aria-label="全选频道"
            >
              <span class="btn-icon" aria-hidden="true"></span>
              <span class="btn-label">全选</span>
            </button>
            <button
              type="button"
              class="btn selection-action"
              id="btn-enable-selected"
              title="启用所选频道"
              aria-label="启用所选频道"
              hidden
            >
              <span class="btn-icon" aria-hidden="true"></span>
              <span class="btn-label">启用</span>
            </button>
            <button
              type="button"
              class="btn selection-action"
              id="btn-disable-selected"
              title="停用所选频道"
              aria-label="停用所选频道"
              hidden
            >
              <span class="btn-icon" aria-hidden="true"></span>
              <span class="btn-label">停用</span>
            </button>
            <button
              type="button"
              class="btn danger selection-action"
              id="btn-delete-selected"
              title="删除所选频道"
              aria-label="删除所选频道"
              hidden
            >
              <span class="btn-icon" aria-hidden="true"></span>
              <span class="btn-label">删除所选</span>
            </button>
            <button
              type="button"
              class="btn danger selection-unrelated"
              id="btn-reset"
              title="恢复默认频道"
              aria-label="恢复默认频道"
            >
              <span class="btn-icon" aria-hidden="true"></span>
              <span class="btn-label">恢复默认</span>
            </button>
          </div>
        </div>
        <div
          id="check-msg"
          class="msg check-msg"
          role="status"
          aria-live="polite"
          aria-atomic="true"
          hidden
        >
          <span id="check-msg-text"></span>
        </div>
        <div class="stats-line">
          <p class="hint" id="stats"></p>
          <div class="source-guide" aria-label="频道来源">
            <span id="source-icon" class="source-icon" aria-hidden="true"></span>
            <span id="source-status" class="source-status" aria-live="polite">准备同步</span>
            <a
              class="remote-source-link"
              href="https://github.com/fish2018/pansou/issues/4"
              target="_blank"
              rel="noopener noreferrer"
            >
              <span id="source-link-icon" aria-hidden="true"></span>
              <span>来源</span>
            </a>
            <span
              id="source-feedback"
              class="source-feedback"
              role="status"
              aria-live="polite"
              aria-atomic="true"
            ></span>
          </div>
        </div>
        <div id="channel-list" class="channel-list"></div>
      </section>
    </div>
    <div
      id="confirm-dialog"
      class="confirm-dialog"
      hidden
      aria-hidden="true"
    >
      <button
        type="button"
        class="confirm-dialog-backdrop"
        id="confirm-backdrop"
        aria-label="取消"
      ></button>
      <section
        class="confirm-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="confirm-title"
        aria-describedby="confirm-message"
      >
        <div class="confirm-copy">
          <p class="confirm-kicker">确认操作</p>
          <h2 id="confirm-title"></h2>
          <p id="confirm-message"></p>
        </div>
        <div class="confirm-actions">
          <button type="button" class="confirm-button is-cancel" id="confirm-cancel">
            <span class="confirm-button-icon" id="confirm-cancel-icon" aria-hidden="true"></span>
            <span>取消</span>
          </button>
          <button type="button" class="confirm-button is-accept" id="confirm-accept">
            <span class="confirm-button-icon" id="confirm-accept-icon" aria-hidden="true"></span>
            <span id="confirm-accept-label">确定</span>
          </button>
        </div>
      </section>
    </div>
    <script type="module" src="options.js?v=20260809-dbpanso-1"></script>
  </body>
</html>
